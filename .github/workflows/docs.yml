name: Docs

on:
  push:
    branches:
    - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1     # v7.0.1
      with:
        persist-credentials: false

    - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6     # v6.4.0

    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6     # v6.0.1
      with:
        java-version: 25.0.4+101.0.LTS
        distribution: temurin

    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6     # v6.4.0
      with:
        cache-provider: basic

    - run: ./gradlew dokkaGeneratePublicationHtml

    - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d     # v6.0.0

    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9     # v5.0.0
      with:
        path: weblate-android/build/dokka/html

    - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346     # v5.0.1
      id: deployment
