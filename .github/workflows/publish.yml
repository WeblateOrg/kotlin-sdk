name: Publish release

on:
  push:
    tags:
    - '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Validate release tag and version
      run: python3 .github/scripts/release.py validate

  release-plugin:
    needs: validate
    environment: gradle-publish
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1     # v7.0.1
      with:
        persist-credentials: false

    - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6     # v6.4.0

    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6     # v6.0.1
      with:
        java-version: 25.0.4+101.0.LTS
        distribution: temurin

    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6     # v6.4.0
      with:
        cache-disabled: true

    - name: Build plugin release artifacts
      run: ./gradlew --warning-mode all --no-build-cache :plugin-android:jar :plugin-android:sourcesJar :plugin-android:javadocJar

    - name: Collect plugin release artifacts
      run: python3 .github/scripts/release.py stage plugin

    - name: Attest plugin release artifacts
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: dist/*

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-plugin
        path: dist/*
        if-no-files-found: error
        overwrite: true

    - name: Publish plugin package
      run: ./gradlew --warning-mode all --no-build-cache publishPlugins
      env:
        GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
        GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

  release-library:
    needs: validate
    environment: maven-publish
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1     # v7.0.1
      with:
        persist-credentials: false

    - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6     # v6.4.0

    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6     # v6.0.1
      with:
        java-version: 25.0.4+101.0.LTS
        distribution: temurin

    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6     # v6.4.0
      with:
        cache-disabled: true

    - name: Build library release artifacts
      run: ./gradlew --warning-mode all --no-build-cache :weblate-android:bundleReleaseAar :weblate-android:sourceReleaseJar :weblate-android:javaDocReleaseJar

    - name: Collect library release artifacts
      run: python3 .github/scripts/release.py stage library

    - name: Attest library release artifacts
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: dist/*

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-library
        path: dist/*
        if-no-files-found: error
        overwrite: true

    - name: Publish library package
      run: ./gradlew --warning-mode all --no-build-cache publishReleasePublicationToCentralReleaseRepository notifyCentralReleaseRepository
      env:
        PGP_SIGNING_KEY_ID: ${{ secrets.PGP_SIGNING_KEY_ID }}
        PGP_PRIVATE_SIGNING_KEY: ${{ secrets.PGP_PRIVATE_SIGNING_KEY }}
        PGP_PRIVATE_SIGNING_KEY_PASSWORD: ${{ secrets.PGP_PRIVATE_SIGNING_KEY_PASSWORD }}
        SONATYPE_MAVEN_CENTRAL_USERNAME: ${{ secrets.SONATYPE_MAVEN_CENTRAL_USERNAME }}
        SONATYPE_MAVEN_CENTRAL_PASSWORD: ${{ secrets.SONATYPE_MAVEN_CENTRAL_PASSWORD }}

  release-github:
    name: Create release on GitHub
    needs:
    - validate
    - release-plugin
    - release-library
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-plugin
        path: dist
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-library
        path: dist
    - name: Publish GitHub release with all assets
      run: python3 .github/scripts/release.py publish
      env:
        GH_TOKEN: ${{ github.token }}
