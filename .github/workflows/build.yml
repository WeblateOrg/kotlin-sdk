name: Build
on:
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - '**'
jobs:
  build-android:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6   # v6.4.0
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6   # v6.0.1
      with:
        java-version: 25.0.4+101.0.LTS
        distribution: temurin
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6   # v6.4.0
      with:
        cache-provider: basic
    - run: ./gradlew publishToMavenLocal
    - run: ./gradlew -p sample-android :app:assembleDebug
permissions:
  contents: read
